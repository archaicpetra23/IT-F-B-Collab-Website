<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Analysis — FinForecast</title>
  <meta name="description" content="Analisis BEP (Break Even Point) dan Payback Period untuk keputusan investasi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-content">
    <div class="page-content" id="pageContent"></div>
  </div>
</div>
<script src="js/shared.js"></script>
<script>
authGuard();
document.getElementById('app').insertAdjacentHTML('afterbegin', renderSidebar('analysis'));
document.querySelector('.main-content').insertAdjacentHTML('afterbegin', renderTopbar('Financial Analysis','Analisis BEP & Payback Period untuk keputusan bisnis'));

let bepChart, paybackChart;
let _bepDebounce, _pbDebounce;

// ===== KONSTANTA KEAMANAN =====
const MAX_CHART_POINTS = 20;   // Maks titik di chart
const MAX_BEP_UNIT     = 1e8;  // 100 juta unit — di atas ini chart tidak ditampilkan
const MAX_PB_YEARS     = 200;  // 200 tahun — di atas ini chart tidak ditampilkan

document.getElementById('pageContent').innerHTML = `
<!-- BEP Section -->
<div class="section-title animate-fade-up">Break Even Point (BEP) Analysis</div>
<div class="section-subtitle animate-fade-up">BEP = Fixed Cost ÷ (Selling Price - Variable Cost)</div>

<div class="grid-2 animate-fade-up" style="margin-bottom:28px;align-items:start">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Input BEP</div>
      <button class="btn btn-outline" onclick="resetBEP()" style="padding:6px 14px;font-size:13px">Reset</button>
    </div>
    <div class="form-group">
      <label class="form-label">Fixed Cost (Biaya Tetap)</label>
      <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="bep-fixed" value="50000" oninput="debounceBEP()"></div>
    </div>
    <div class="form-row">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Selling Price / Unit</label>
        <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="bep-price" value="50" oninput="debounceBEP()"></div>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">Variable Cost / Unit</label>
        <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="bep-var" value="20" oninput="debounceBEP()"></div>
      </div>
    </div>
    <div class="form-group" style="margin-top:16px">
      <label class="form-label">Target Produksi (Unit)</label>
      <input type="number" class="form-input" id="bep-target" value="2000" oninput="debounceBEP()">
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Hasil BEP</div>
      <span class="badge badge-green" id="bep-profitability">Profitable</span>
    </div>
    <div class="grid-2" style="gap:12px;margin-bottom:16px">
      <div style="background:var(--primary-bg);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--green-200)">
        <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">BEP Unit</div>
        <div style="font-size:26px;font-weight:800;color:var(--primary-dark);font-family:'Outfit',sans-serif" id="bep-unit-result">–</div>
        <div style="font-size:11px;color:var(--gray-400)">unit</div>
      </div>
      <div style="background:var(--orange-50);border-radius:var(--radius);padding:16px;text-align:center;border:1px solid var(--orange-200)">
        <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">BEP Revenue</div>
        <div style="font-size:18px;font-weight:800;color:var(--secondary-dark);font-family:'Outfit',sans-serif" id="bep-rev-result">–</div>
      </div>
    </div>
    <div class="result-box">
      <div class="result-item"><span class="result-label">Contribution Margin</span><span class="result-value" id="bep-cm">–</span></div>
      <div class="result-item"><span class="result-label">Target vs BEP</span><span class="result-value" id="bep-vs-target">–</span></div>
      <div class="result-item"><span class="result-label">Margin of Safety</span><span class="result-value highlight" id="bep-mos">–</span></div>
    </div>
  </div>
</div>

<div class="card animate-fade-up delay-2" style="margin-bottom:28px">
  <div class="card-header">
    <div>
      <div class="card-title">BEP Chart — Profit / Loss Visualization</div>
      <div class="card-subtitle">Titik impas biaya total vs pendapatan total</div>
    </div>
  </div>
  <canvas id="bepChart" height="100"></canvas>
</div>

<!-- Payback Period Section -->
<div class="section-title animate-fade-up delay-3">Payback Period Analysis</div>
<div class="section-subtitle animate-fade-up delay-3">Payback Period = Initial Investment ÷ Annual Cash Inflow</div>

<div class="grid-2 animate-fade-up delay-3" style="margin-bottom:24px;align-items:start">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Input Payback</div>
      <button class="btn btn-outline" onclick="resetPayback()" style="padding:6px 14px;font-size:13px">Reset</button>
    </div>
    <div class="form-group">
      <label class="form-label">Initial Investment (Modal Awal)</label>
      <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="pb-invest" value="100000" oninput="debouncePayback()"></div>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Annual Cash Inflow (Arus Kas Tahunan)</label>
      <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="pb-inflow" value="25000" oninput="debouncePayback()"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-title">Hasil Payback Period</div>
      <span class="badge badge-orange" id="pb-status-badge">Recovery</span>
    </div>
    <div style="text-align:center;padding:20px 0;border-bottom:1px dashed var(--gray-200);margin-bottom:16px">
      <div style="font-size:13px;color:var(--gray-500);margin-bottom:8px">Estimasi Waktu Balik Modal</div>
      <div style="font-size:48px;font-weight:800;color:var(--primary-dark);font-family:'Outfit',sans-serif;line-height:1" id="pb-years-big">–</div>
      <div style="font-size:16px;color:var(--gray-600);margin-top:6px" id="pb-years-label">tahun</div>
    </div>
    <div class="result-box" style="margin-top:0">
      <div class="result-item"><span class="result-label">Annual Cash Inflow</span><span class="result-value" id="pb-r-inflow">–</span></div>
      <div class="result-item"><span class="result-label">Recovery Status</span><span class="result-value" id="pb-status">–</span></div>
      <div class="result-item"><span class="result-label">ROI (5yr)</span><span class="result-value highlight orange" id="pb-roi">–</span></div>
    </div>
  </div>
</div>

<div class="card animate-fade-up delay-4">
  <div class="card-header">
    <div>
      <div class="card-title">Payback Period — Grafik Kumulatif</div>
      <div class="card-subtitle">Akumulasi kas vs investasi awal</div>
    </div>
  </div>
  <canvas id="paybackChart" height="100"></canvas>
</div>
`;

function calculateBEP() {
  const fixed    = +document.getElementById('bep-fixed').value || 0;
  const price    = +document.getElementById('bep-price').value || 0;
  const variable = +document.getElementById('bep-var').value   || 0;
  const target   = +document.getElementById('bep-target').value || 0;
  const cm = price - variable;

  // --- Validasi ---
  if (cm <= 0) {
    document.getElementById('bep-unit-result').textContent = 'Error';
    document.getElementById('bep-rev-result').textContent  = 'Margin Negatif';
    document.getElementById('bep-cm').textContent          = '–';
    document.getElementById('bep-vs-target').textContent   = '⚠️ Harga jual harus > biaya variabel';
    document.getElementById('bep-mos').textContent         = '–';
    if (bepChart) { bepChart.destroy(); bepChart = null; }
    return;
  }

  const bepUnit = Math.ceil(fixed / cm);
  const bepRev  = bepUnit * price;
  const mos     = target > bepUnit ? (((target - bepUnit) / target) * 100).toFixed(1) : 0;

  document.getElementById('bep-unit-result').textContent = bepUnit.toLocaleString('id-ID');
  document.getElementById('bep-rev-result').textContent  = formatRp(bepRev);
  document.getElementById('bep-cm').textContent          = formatRp(cm) + ' / unit';
  document.getElementById('bep-vs-target').textContent   = target >= bepUnit
    ? `✅ Aman (+${(target - bepUnit).toLocaleString('id-ID')} unit)`
    : `⚠️ Kurang ${(bepUnit - target).toLocaleString('id-ID')} unit`;
  document.getElementById('bep-mos').textContent         = mos + '%';
  document.getElementById('bep-profitability').textContent  = target >= bepUnit ? 'Profitable' : 'At Risk';
  document.getElementById('bep-profitability').className    = target >= bepUnit ? 'badge badge-green' : 'badge badge-red';

  // --- Guard: jangan render chart jika terlalu besar ---
  if (bepUnit > MAX_BEP_UNIT) {
    if (bepChart) { bepChart.destroy(); bepChart = null; }
    const ctx = document.getElementById('bepChart').getContext('2d');
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.font = '14px Inter, sans-serif';
    ctx.fillStyle = '#9ca3af';
    ctx.textAlign = 'center';
    ctx.fillText('⚠️ Nilai terlalu besar untuk ditampilkan dalam grafik', ctx.canvas.width / 2, 80);
    return;
  }

  // --- Buat 20 titik merata (linspace) — TIDAK membuat array jutaan elemen ---
  const maxUnit  = Math.max(bepUnit * 2, target * 1.2, bepUnit + 100);
  const step     = Math.ceil(maxUnit / MAX_CHART_POINTS);
  const units    = Array.from({length: MAX_CHART_POINTS}, (_, i) => (i + 1) * step);
  const totalCost = units.map(u => fixed + u * variable);
  const totalRev  = units.map(u => u * price);
  const bepIdx    = units.findIndex(u => u >= bepUnit);
  const bepData   = units.map((_, i) => i === bepIdx ? bepRev : null);
  const bepRadius = units.map((_, i) => i === bepIdx ? 8 : 0);

  const ctx = document.getElementById('bepChart').getContext('2d');
  if (bepChart) bepChart.destroy();
  bepChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: units.map(u => u.toLocaleString('id-ID') + ' unit'),
      datasets: [
        { label: 'Total Revenue', data: totalRev, borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.08)', tension: 0.1, fill: false, pointRadius: 0, borderWidth: 2.5 },
        { label: 'Total Cost',    data: totalCost, borderColor: '#ef4444', backgroundColor: 'rgba(239,68,68,0.08)', tension: 0.1, fill: false, pointRadius: 0, borderWidth: 2.5 },
        { label: 'BEP Point',     data: bepData, borderColor: '#f97316', backgroundColor: '#f97316', pointRadius: bepRadius, showLine: false }
      ]
    },
    options: {
      responsive: true,
      animation: { duration: 300 },
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: c => ' ' + formatRp(c.raw) } } },
      scales: {
        y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => 'Rp ' + v.toLocaleString('id-ID'), font: { size: 10 } } },
        x: { grid: { display: false }, ticks: { maxTicksLimit: 10, font: { size: 10 } } }
      }
    }
  });
}

function calculatePayback() {
  const invest  = +document.getElementById('pb-invest').value || 0;
  const inflow  = +document.getElementById('pb-inflow').value || 1;

  // --- Guard: inflow nol/negatif ---
  if (inflow <= 0) {
    document.getElementById('pb-years-big').textContent   = '∞';
    document.getElementById('pb-years-label').textContent = 'tahun — Arus kas harus > 0';
    document.getElementById('pb-r-inflow').textContent    = formatRp(inflow);
    document.getElementById('pb-status').textContent      = '⚠️ Tidak valid';
    document.getElementById('pb-roi').textContent         = '–';
    return;
  }

  const pp    = invest / inflow;
  const roi5  = invest > 0 ? ((inflow * 5 - invest) / invest * 100).toFixed(1) : 'N/A';

  document.getElementById('pb-years-big').textContent   = pp >= 1000 ? '> 1.000' : pp.toFixed(2);
  document.getElementById('pb-years-label').textContent = pp < 2
    ? 'tahun 🚀 Sangat Cepat'
    : pp < 5  ? 'tahun ✅ Baik'
    : pp < 50 ? 'tahun ⚠️ Pertimbangkan Kembali'
    : 'tahun ❌ Tidak Layak';
  document.getElementById('pb-r-inflow').textContent    = formatRp(inflow);
  document.getElementById('pb-status').textContent      = pp < 5  ? '✅ Layak Investasi'
    : pp < 20 ? '⚠️ Pertimbangkan Ulang' : '❌ Tidak Layak';
  document.getElementById('pb-roi').textContent         = roi5 + '% (5 tahun)';
  document.getElementById('pb-status-badge').textContent = pp < 5 ? 'Layak' : pp < 20 ? 'Risiko' : 'Tidak Layak';
  document.getElementById('pb-status-badge').className  = pp < 5 ? 'badge badge-green' : pp < 20 ? 'badge badge-orange' : 'badge badge-red';

  // --- Guard: jangan render chart jika period terlalu besar ---
  if (pp > MAX_PB_YEARS) {
    if (paybackChart) { paybackChart.destroy(); paybackChart = null; }
    const ctx2 = document.getElementById('paybackChart').getContext('2d');
    ctx2.clearRect(0, 0, ctx2.canvas.width, ctx2.canvas.height);
    ctx2.font      = '14px Inter, sans-serif';
    ctx2.fillStyle = '#9ca3af';
    ctx2.textAlign = 'center';
    ctx2.fillText(
      `⚠️ Payback Period ${pp >= 1000 ? '> 1.000' : Math.round(pp)} tahun — terlalu besar untuk divisualisasikan`,
      ctx2.canvas.width / 2, 80
    );
    return;
  }

  // --- Buat maks 20 titik merata (linspace) ---
  const totalYears = Math.ceil(pp) + 3;
  const step       = Math.max(1, Math.ceil(totalYears / MAX_CHART_POINTS));
  const years      = Array.from(
    {length: Math.ceil(totalYears / step)},
    (_, i) => (i + 1) * step
  ).filter(y => y <= totalYears + step);

  const cumCash   = years.map(y => y * inflow);
  const investLine = years.map(() => invest);

  const ctx2 = document.getElementById('paybackChart').getContext('2d');
  if (paybackChart) paybackChart.destroy();
  paybackChart = new Chart(ctx2, {
    type: 'line',
    data: {
      labels: years.map(y => 'Tahun ' + y),
      datasets: [
        { label: 'Kumulatif Cash Flow', data: cumCash,    borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', tension: 0.4, fill: true, pointBackgroundColor: '#16a34a', pointRadius: 4, borderWidth: 2.5 },
        { label: 'Initial Investment',  data: investLine, borderColor: '#f97316', borderDash: [8, 4], backgroundColor: 'transparent', pointRadius: 0, borderWidth: 2 }
      ]
    },
    options: {
      responsive: true,
      animation: { duration: 300 },
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: c => ' ' + formatRp(c.raw) } } },
      scales: {
        y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => 'Rp ' + v.toLocaleString('id-ID'), font: { size: 11 } } },
        x: { grid: { display: false } }
      }
    }
  });
}

// ===== DEBOUNCE WRAPPERS =====
// Tunda kalkulasi 400ms setelah berhenti mengetik — mencegah lag saat input angka besar
function debounceBEP() {
  saveBEPInputs();
  clearTimeout(_bepDebounce);
  _bepDebounce = setTimeout(calculateBEP, 400);
}

function debouncePayback() {
  savePBInputs();
  clearTimeout(_pbDebounce);
  _pbDebounce = setTimeout(calculatePayback, 400);
}

function saveBEPInputs() {
  setState({
    fixedCost:           +document.getElementById('bep-fixed').value  || 0,
    sellingPrice:        +document.getElementById('bep-price').value  || 0,
    variableCostPerUnit: +document.getElementById('bep-var').value    || 0,
    bepTarget:           +document.getElementById('bep-target').value || 0
  });
}

function savePBInputs() {
  setState({
    initialInvestment: +document.getElementById('pb-invest').value  || 0,
    annualCashInflow:  +document.getElementById('pb-inflow').value   || 1
  });
}

function loadAnalysisInputs(s) {
  document.getElementById('bep-fixed').value  = s.fixedCost;
  document.getElementById('bep-price').value  = s.sellingPrice;
  document.getElementById('bep-var').value    = s.variableCostPerUnit;
  document.getElementById('bep-target').value = s.bepTarget;
  document.getElementById('pb-invest').value  = s.initialInvestment;
  document.getElementById('pb-inflow').value  = s.annualCashInflow;
}

function initAnalysis() {
  loadAnalysisInputs(getState());
  calculateBEP();
  calculatePayback();
}

function resetBEP() {
  setState({
    fixedCost: APP_DATA.fixedCost, sellingPrice: APP_DATA.sellingPrice,
    variableCostPerUnit: APP_DATA.variableCostPerUnit, bepTarget: APP_DATA.bepTarget
  });
  loadAnalysisInputs(getState());
  calculateBEP();
}

function resetPayback() {
  setState({
    initialInvestment: APP_DATA.initialInvestment,
    annualCashInflow: APP_DATA.annualCashInflow
  });
  loadAnalysisInputs(getState());
  calculatePayback();
}

initAnalysis();
</script>
</body>
</html>
