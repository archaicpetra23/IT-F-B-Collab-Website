<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Statement — FinForecast</title>
  <meta name="description" content="Forecast laporan laba rugi interaktif dengan kalkulasi otomatis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout" id="app">
  <div class="main-content">
    <div class="page-content" id="pageContent"></div>
  </div>
</div>
<script src="js/shared.js"></script>
<script>
authGuard();
document.getElementById('app').insertAdjacentHTML('afterbegin', renderSidebar('income'));
document.querySelector('.main-content').insertAdjacentHTML('afterbegin', renderTopbar('Income Statement Forecast','Kalkulasi laba rugi berdasarkan input revenue & biaya'));

let incomeChart;

document.getElementById('pageContent').innerHTML = `
<div class="grid-2 animate-fade-up" style="margin-bottom:24px;align-items:start">
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Input Data Keuangan</div>
        <div class="card-subtitle">Masukkan data untuk kalkulasi forecast</div>
      </div>
      <button class="btn btn-outline" onclick="resetIncome()" style="padding:6px 14px;font-size:13px">Reset</button>
    </div>
    <form id="incomeForm" onsubmit="return false">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Revenue (Pendapatan)</label>
          <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="i-revenue" value="100000" min="0"></div>
        </div>
        <div class="form-group">
          <label class="form-label">COGS (Harga Pokok)</label>
          <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="i-cogs" value="40000" min="0"></div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Operating Expense</label>
          <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="i-expense" value="20000" min="0"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Tax (Pajak)</label>
          <div class="input-group"><span class="input-prefix">Rp</span><input type="number" class="form-input" id="i-tax" value="5000" min="0"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Growth Rate Forecast (%)</label>
        <div class="input-group"><span class="input-prefix">%</span><input type="number" class="form-input" id="i-growth" value="10" min="0" max="100"></div>
      </div>
      <button type="button" class="btn btn-primary" style="width:100%;justify-content:center" onclick="calculateIncome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Hitung Forecast
      </button>
    </form>
  </div>

  <div>
    <div class="card" style="margin-bottom:20px" id="incomeResult">
      <div class="card-header">
        <div class="card-title">Hasil Kalkulasi</div>
        <span class="badge badge-green" id="marginBadge">–</span>
      </div>
      <div class="result-box" id="resultBox">
        <div class="result-item"><span class="result-label">Revenue</span><span class="result-value" id="r-revenue">–</span></div>
        <div class="result-item"><span class="result-label">(-) COGS</span><span class="result-value" id="r-cogs">–</span></div>
        <div class="result-item"><span class="result-label">= Gross Profit</span><span class="result-value highlight" id="r-gross">–</span></div>
        <div class="result-item"><span class="result-label">(-) Operating Expense</span><span class="result-value" id="r-expense">–</span></div>
        <div class="result-item"><span class="result-label">(-) Tax</span><span class="result-value" id="r-tax">–</span></div>
        <div class="result-item"><span class="result-label">= Net Profit</span><span class="result-value highlight orange" id="r-net">–</span></div>
        <div class="result-item"><span class="result-label">Profit Margin</span><span class="result-value highlight" id="r-margin">–</span></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Forecast Proyeksi</div>
        <span class="badge badge-orange" id="growthBadge">+10% Growth</span>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:16px">
        <div style="flex:1;background:var(--primary-bg);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--green-200)">
          <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">Forecast Revenue</div>
          <div style="font-size:18px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--primary-dark)" id="fc-rev">–</div>
        </div>
        <div style="flex:1;background:var(--orange-50);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--orange-200)">
          <div style="font-size:11px;color:var(--gray-500);margin-bottom:4px">Forecast Profit</div>
          <div style="font-size:18px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--secondary-dark)" id="fc-profit">–</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="card animate-fade-up delay-2">
  <div class="card-header">
    <div>
      <div class="card-title">Visualisasi Income Statement</div>
      <div class="card-subtitle">Komparasi komponen laba rugi</div>
    </div>
  </div>
  <canvas id="incomeChart" height="120"></canvas>
</div>
`;

function calculateIncome() {
  const rev = +document.getElementById('i-revenue').value || 0;
  const cogs = +document.getElementById('i-cogs').value || 0;
  const exp = +document.getElementById('i-expense').value || 0;
  const tax = +document.getElementById('i-tax').value || 0;
  const growth = +document.getElementById('i-growth').value || 0;

  const gross = rev - cogs;
  const net = gross - exp - tax;
  const margin = rev > 0 ? ((net/rev)*100).toFixed(1) : 0;
  const fcRev = Math.round(rev*(1+growth/100));
  const fcProfit = Math.round(net*(1+growth/100));

  document.getElementById('r-revenue').textContent = formatRp(rev);
  document.getElementById('r-cogs').textContent = formatRp(cogs);
  document.getElementById('r-gross').textContent = formatRp(gross);
  document.getElementById('r-expense').textContent = formatRp(exp);
  document.getElementById('r-tax').textContent = formatRp(tax);
  document.getElementById('r-net').textContent = formatRp(net);
  document.getElementById('r-margin').textContent = margin + '%';
  document.getElementById('marginBadge').textContent = 'Margin ' + margin + '%';
  document.getElementById('growthBadge').textContent = '+' + growth + '% Growth';
  document.getElementById('fc-rev').textContent = formatRp(fcRev);
  document.getElementById('fc-profit').textContent = formatRp(fcProfit);

  const ctx = document.getElementById('incomeChart').getContext('2d');
  if (incomeChart) incomeChart.destroy();
  incomeChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Revenue','COGS','Gross Profit','Op. Expense','Tax','Net Profit'],
      datasets: [
        { label: 'Aktual', data: [rev, cogs, gross, exp, tax, net], backgroundColor: ['#16a34a','#ef4444','#22c55e','#f97316','#7c3aed','#2563eb'], borderRadius: 8, borderSkipped: false },
        { label: 'Forecast (+'+growth+'%)', data: [fcRev, Math.round(cogs*(1+growth/100)), Math.round(gross*(1+growth/100)), Math.round(exp*(1+growth/100)), Math.round(tax*(1+growth/100)), fcProfit], backgroundColor: ['rgba(22,163,74,0.3)','rgba(239,68,68,0.3)','rgba(34,197,94,0.3)','rgba(249,115,22,0.3)','rgba(124,58,237,0.3)','rgba(37,99,235,0.3)'], borderRadius: 8, borderSkipped: false }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' }, tooltip: { callbacks: { label: ctx => ' '+formatRp(ctx.raw) } } },
      scales: { y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => 'Rp '+v.toLocaleString('id-ID'), font: { size: 11 } } }, x: { grid: { display: false } } }
    }
  });
}

function resetIncome() {
  document.getElementById('i-revenue').value = 100000;
  document.getElementById('i-cogs').value = 40000;
  document.getElementById('i-expense').value = 20000;
  document.getElementById('i-tax').value = 5000;
  document.getElementById('i-growth').value = 10;
  calculateIncome();
}

calculateIncome();
</script>
</body>
</html>
