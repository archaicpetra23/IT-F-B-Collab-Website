<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — FinForecast</title>
  <meta name="description" content="Dashboard ringkasan keuangan dan forecast interaktif.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app-layout" id="app">
  <!-- Sidebar injected by JS -->
  <div class="main-content">
    <!-- Topbar injected by JS -->
    <div class="page-content" id="pageContent"></div>
  </div>
</div>

<script src="js/shared.js"></script>
<script>
// Auth
const auth = authGuard();

// Inject layout
document.getElementById('app').insertAdjacentHTML('afterbegin', renderSidebar('dashboard'));
document.querySelector('.main-content').insertAdjacentHTML('afterbegin', renderTopbar('Dashboard', 'Ringkasan laporan keuangan & forecast'));

function initDashboard() {
  // Selalu baca dari centralized state agar mencerminkan data terbaru dari semua modul
  const d = getState();

  const grossProfit = d.revenue - d.cogs;
  const netProfit = grossProfit - d.expenses - d.tax;
  const profitMargin = d.revenue > 0 ? ((netProfit / d.revenue) * 100).toFixed(1) : 0;
  const netCash = (d.cashSales + d.cashInvestment) - (d.cashSalary + d.cashOperational);
  const totalAssets = d.cash + d.inventory + d.equipment;
  const totalLiabilities = d.debt + d.payables;
  const cm = d.sellingPrice - d.variableCostPerUnit;
  const bepUnit = cm > 0 ? Math.ceil(d.fixedCost / cm) : 0;
  const bepRevenue = bepUnit * d.sellingPrice;
  const paybackYears = d.annualCashInflow > 0 ? (d.initialInvestment / d.annualCashInflow).toFixed(1) : '∞';

  // Forecast
  const gr = d.growthRate / 100;
  const forecastRevenue = Math.round(d.revenue * (1 + gr));
  const forecastProfit = Math.round(netProfit * (1 + gr));

  const pageContent = document.getElementById('pageContent');
  pageContent.innerHTML = `
    <div class="animate-fade-up" style="margin-bottom:24px">
      <div class="grid-4">
        <div class="stat-card green animate-fade-up delay-1">
          <div class="stat-icon green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="cnt-rev">Rp 0</div>
            <div class="stat-change up">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="18 15 12 9 6 15"/></svg>
              +${d.growthRate}% forecast
            </div>
          </div>
        </div>
        <div class="stat-card orange animate-fade-up delay-2">
          <div class="stat-icon orange">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-label">Net Profit</div>
            <div class="stat-value" id="cnt-profit">Rp 0</div>
            <div class="stat-change up">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="18 15 12 9 6 15"/></svg>
              Margin ${profitMargin}%
            </div>
          </div>
        </div>
        <div class="stat-card blue animate-fade-up delay-3">
          <div class="stat-icon blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-label">Net Cash Flow</div>
            <div class="stat-value" id="cnt-cash">Rp 0</div>
            <div class="stat-change ${netCash >= 0 ? 'up' : 'down'}">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="${netCash >= 0 ? '18 15 12 9 6 15' : '6 9 12 15 18 9'}"/></svg>
              ${netCash >= 0 ? 'Surplus' : 'Defisit'}
            </div>
          </div>
        </div>
        <div class="stat-card purple animate-fade-up delay-4">
          <div class="stat-icon purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-label">BEP Revenue</div>
            <div class="stat-value" id="cnt-bep">Rp 0</div>
            <div class="stat-change up">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="18 15 12 9 6 15"/></svg>
              ${bepUnit.toLocaleString('id-ID')} unit
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid-2-1 animate-fade-up delay-2" style="margin-bottom:24px">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Revenue vs Profit Overview</div>
            <div class="card-subtitle">Perbandingan revenue, COGS, dan net profit</div>
          </div>
          <span class="badge badge-green">2026</span>
        </div>
        <canvas id="revenueChart" height="260"></canvas>
      </div>
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Expense Breakdown</div>
            <div class="card-subtitle">Distribusi biaya operasional</div>
          </div>
        </div>
        <canvas id="expenseChart" height="220"></canvas>
        <div style="margin-top:16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span style="font-size:13px;color:var(--gray-600)">COGS</span>
            <span style="font-size:13px;font-weight:600;color:var(--gray-900)">${formatRp(d.cogs)}</span>
          </div>
          <div class="progress-bar" style="margin-bottom:12px"><div class="progress-fill green" style="width:${d.revenue>0?(d.cogs/d.revenue*100).toFixed(0):0}%"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span style="font-size:13px;color:var(--gray-600)">Operating Expense</span>
            <span style="font-size:13px;font-weight:600;color:var(--gray-900)">${formatRp(d.expenses)}</span>
          </div>
          <div class="progress-bar" style="margin-bottom:12px"><div class="progress-fill orange" style="width:${d.revenue>0?(d.expenses/d.revenue*100).toFixed(0):0}%"></div></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span style="font-size:13px;color:var(--gray-600)">Tax</span>
            <span style="font-size:13px;font-weight:600;color:var(--gray-900)">${formatRp(d.tax)}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill green" style="width:${d.revenue>0?(d.tax/d.revenue*100).toFixed(0):0}%;background:linear-gradient(90deg,#7c3aed,#a78bfa)"></div></div>
        </div>
      </div>
    </div>

    <div class="grid-2 animate-fade-up delay-3" style="margin-bottom:24px">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Forecast Summary</div>
            <div class="card-subtitle">Proyeksi pertumbuhan ${d.growthRate}%</div>
          </div>
          <span class="badge badge-orange">Forecast</span>
        </div>
        <canvas id="forecastChart" height="220"></canvas>
      </div>
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Analisis Cepat</div>
            <div class="card-subtitle">Indikator keuangan utama</div>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;margin-top:4px">
          <div style="background:var(--primary-bg);border-radius:var(--radius);padding:16px;border:1px solid var(--green-200)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:12px;color:var(--gray-500);margin-bottom:2px">Gross Profit</div>
                <div style="font-size:20px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--primary-dark)">${formatRp(grossProfit)}</div>
              </div>
              <div style="background:var(--primary);color:white;border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:700">${d.revenue>0?((grossProfit/d.revenue)*100).toFixed(1):0}%</div>
            </div>
          </div>
          <div style="background:var(--secondary-bg);border-radius:var(--radius);padding:16px;border:1px solid var(--orange-200)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:12px;color:var(--gray-500);margin-bottom:2px">Payback Period</div>
                <div style="font-size:20px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--secondary-dark)">${paybackYears} Tahun</div>
              </div>
              <div style="background:var(--secondary);color:white;border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:700">ROI</div>
            </div>
          </div>
          <div style="background:var(--gray-50);border-radius:var(--radius);padding:16px;border:1px solid var(--gray-200)">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:12px;color:var(--gray-500);margin-bottom:2px">Total Assets</div>
                <div style="font-size:20px;font-weight:700;font-family:'Outfit',sans-serif;color:var(--gray-900)">${formatRp(totalAssets)}</div>
              </div>
              <div style="background:#7c3aed;color:white;border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:700">Neraca</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card animate-fade-up delay-4">
      <div class="card-header">
        <div>
          <div class="card-title">Navigasi Modul</div>
          <div class="card-subtitle">Akses cepat ke semua fitur analisis</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
        ${[
          { href:'income.html', label:'Income Statement', sub:'Forecast laba rugi', color:'var(--primary)', bg:'var(--primary-bg)', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>' },
          { href:'cashflow.html', label:'Cash Flow', sub:'Arus kas masuk/keluar', color:'#2563eb', bg:'#eff6ff', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>' },
          { href:'balance.html', label:'Balance Sheet', sub:'Neraca keuangan', color:'#7c3aed', bg:'#f5f3ff', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V12m0 0L5 7m7 5l7-5"/><path d="M3 18l4-3m10 3l-4-3"/></svg>' },
          { href:'analysis.html', label:'Financial Analysis', sub:'BEP & Payback Period', color:'var(--secondary)', bg:'var(--orange-50)', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>' },
        ].map(m => `
          <a href="${m.href}" style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 16px;background:${m.bg};border-radius:var(--radius);border:1.5px solid transparent;transition:var(--transition);text-decoration:none" onmouseover="this.style.borderColor='${m.color}';this.style.transform='translateY(-3px)'" onmouseout="this.style.borderColor='transparent';this.style.transform=''">
            <div style="width:48px;height:48px;background:${m.color};border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:white;margin-bottom:12px;box-shadow:0 4px 12px ${m.color}40">${m.icon}</div>
            <div style="font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:4px">${m.label}</div>
            <div style="font-size:12px;color:var(--gray-500)">${m.sub}</div>
          </a>
        `).join('')}
      </div>
    </div>
    `;

  // Count-up animations
  setTimeout(() => {
    animateCount(document.getElementById('cnt-rev'), d.revenue, 'Rp ');
    animateCount(document.getElementById('cnt-profit'), netProfit, 'Rp ');
    animateCount(document.getElementById('cnt-cash'), netCash, 'Rp ');
    animateCount(document.getElementById('cnt-bep'), bepRevenue, 'Rp ');
  }, 300);

  // Charts
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  const baseRev = Array.from({length:12}, (_,i) => Math.round(d.revenue * (1 + i*0.02)));
  const baseProfit = baseRev.map(r => Math.round(r * (d.revenue > 0 ? netProfit/d.revenue : 0)));

  new Chart(document.getElementById('revenueChart'), {
    type: 'bar',
    data: {
      labels: months,
      datasets: [
        { label: 'Revenue', data: baseRev, backgroundColor: 'rgba(22,163,74,0.15)', borderColor: '#16a34a', borderWidth: 2, borderRadius: 6, borderSkipped: false },
        { label: 'Net Profit', data: baseProfit, backgroundColor: 'rgba(249,115,22,0.15)', borderColor: '#f97316', borderWidth: 2, borderRadius: 6, borderSkipped: false, type: 'line', tension: 0.4, fill: true, pointBackgroundColor: '#f97316', pointRadius: 4 }
      ]
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, boxWidth: 12, padding: 16 } }, tooltip: { callbacks: { label: ctx => ' ' + formatRp(ctx.raw) } } },
      scales: { y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => 'Rp '+v.toLocaleString('id-ID'), font: { size: 11 } } }, x: { grid: { display: false }, ticks: { font: { size: 11 } } } }
    }
  });

  new Chart(document.getElementById('expenseChart'), {
    type: 'doughnut',
    data: {
      labels: ['COGS','Expenses','Tax','Net Profit'],
      datasets: [{ data: [d.cogs, d.expenses, d.tax, netProfit], backgroundColor: ['#16a34a','#f97316','#7c3aed','#2563eb'], borderWidth: 0, hoverOffset: 6 }]
    },
    options: {
      responsive: true,
      cutout: '68%',
      plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter', size: 11 }, padding: 12 } }, tooltip: { callbacks: { label: ctx => ' ' + formatRp(ctx.raw) } } }
    }
  });

  new Chart(document.getElementById('forecastChart'), {
    type: 'line',
    data: {
      labels: ['2024','2025 (Actual)','2026 (Forecast)','2027 (Est)','2028 (Est)'],
      datasets: [
        { label: 'Revenue', data: [Math.round(d.revenue*0.75), d.revenue, forecastRevenue, Math.round(forecastRevenue*(1+gr)), Math.round(forecastRevenue*(1+gr)**2)], borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.08)', tension: 0.4, fill: true, pointBackgroundColor: '#16a34a', pointRadius: 5, borderWidth: 2.5 },
        { label: 'Net Profit', data: [Math.round(netProfit*0.6), netProfit, forecastProfit, Math.round(forecastProfit*(1+gr)), Math.round(forecastProfit*(1+gr)**2)], borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.08)', tension: 0.4, fill: true, pointBackgroundColor: '#f97316', pointRadius: 5, borderWidth: 2.5 }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top', labels: { font: { family: 'Inter', size: 11 }, boxWidth: 12, padding: 12 } }, tooltip: { callbacks: { label: ctx => ' '+formatRp(ctx.raw) } } },
      scales: { y: { grid: { color: 'rgba(0,0,0,0.05)' }, ticks: { callback: v => 'Rp '+v.toLocaleString('id-ID'), font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } }
    }
  });
}

initDashboard();

</script>
</body>
</html>
